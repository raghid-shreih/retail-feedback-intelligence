[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-feedback-intelligence"
version = "0.1.0"
description = "Reproducible retail review analysis and recommendation experiments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pandas>=2.0,<4", "openai>=1.50,<3"]

[project.scripts]
retail-feedback = "retail_feedback.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
